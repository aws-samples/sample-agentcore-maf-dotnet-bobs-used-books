image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - verify

verify:
  stage: verify
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm
    - export PATH="$HOME/.dotnet:$PATH"
    - export DOTNET_ROLL_FORWARD=Major
  script:
    - dotnet build BobsBooks.sln
    - dotnet test api/BookInventory.Api.UnitTests/BookInventory.Api.UnitTests.csproj --no-build
    - dotnet test api/BookInventory.Service.UnitTests/BookInventory.Service.UnitTests.csproj --no-build
    - dotnet test tests/BobsBooks.Agent.Tests/BobsBooks.Agent.Tests.csproj --no-build
    - npx -y aws-cdk@2 synth --all
